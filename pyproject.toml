    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "setuptools<81",
    "streamlit>=1.64.0",
    "torch>=2.14.0",
    "torchsummary>=1.5.1",
